<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Card Intro</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .card {
            width: 350px;
            height: 400px;
            border: 1px solid black;
            padding: 10px;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;
            padding: 0;
        }

        .card-header {
            height: 10%;
            border: 1px solid black;
        }

        .card-body {
            height: 70%;
            border: 1px solid black;
        }

        .card-footer {
            height: 20%;
            border: 1px solid black;
        }


        .d-flex {
            display: flex;
        }

        .jc-between {
            justify-content: space-between;
        }

        .al-center {
            align-items: center;
        }

        .title {
            margin-top: 25px;
            margin-bottom: 10px;
            text-align: center;
        }

        .title-heading {
            font-size: 2rem;
        }

        .progress progress {
            width: 100%;

        }

        .fs-1 {
            font-size: xx-large;
        }

        .card-days {
            border: 1px solid red;
            background-color: red;
            border-radius: 25%;
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="card-header d-flex jc-between">
            <span>22 August, 2024</span>
            <i class="bi bi-three-dots-vertical"></i>
        </div>
        <div class="card-body">
            <div class="title">
                <span class="title-heading">Web Designing</span> <br>
                <span class="title-subheading">FlipKart</span>
            </div>
            <div class="progress">
                <span>Progress</span> <br>
                <progress value="70"
                          max="100"></progress>
            </div>
        </div>
        <div class="card-footer d-flex jc-between al-center">

            <div>
                <i class="bi bi-person-circle fs-1"></i>
                <i class="bi bi-person-circle fs-1"></i>
                <i class="bi bi-plus-circle fs-1"></i>
            </div>

            <span class="card-days">3 Days Left</span>

        </div>
    </div>

</body>

</html>
