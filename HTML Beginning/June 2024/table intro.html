<!doctype html>


<!-- 
	table: table container element
	thead: table heading rows container
	tbody: table data rows container
	tr   : table row elment
	td	 : table data cell element
	th   : table header cell elemnt

	table
	|- thead
	|	| -  tr
	|		|- th
	|		|- td
	|
	|- tbody
		|- tr
			|- th
			|- td
	
-->

<html> 
	
	<head> 
		<title>Table Introduction</title>
	</head>
	
	<body> 
		
		<table border="2px"> 
			
			<thead> 
				<tr>
					<th>Name</th>
					<th>Age</th>
					<th>Height</th>
					<th>BloodGroup</th>
				</tr>
			</thead>
			
			<tbody> 
				
				<tr> 
					<td>Suresh</td>
					<td>20</td>
					<td>5.6</td>
					<td>A+</td>
				</tr>
				
				<tr> 
					<td>Ramesh</td>
					<td>21</td>
					<td>5.5</td>
					<td>B+</td>
				</tr>
			
			</tbody>
		
		</table>
		
	</body>
	
</html>
