<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Card 2</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        .d-flex {
            display: flex;
        }

        .jc-between {
            justify-content: space-between;
        }

        .al-center {
            align-items: center;
        }

        .card {
            width: 340px;
            padding-bottom: 5px;
            border: 1px solid rgb(189, 189, 189);
            border-radius: 8px;
            overflow: hidden;
        }

        .card-image-title {
            height: 40%;
            width: 100%;
        }

        .card-image-title img {

            width: 100%;
            height: 100%;
        }

        .card-description {
            padding: 20px 10px;
        }

        .card-detail {
            padding: 5px 10px;
        }

        .card-footer {
            padding: 5px 10px;
        }

        .img-profile {
            width: 48px;
            height: 48px;
            object-fit: cover;
            object-position: center;
            border-radius: 50%;
        }

        .icon-box {
            width: 28px;
            height: 28px;
            padding-right: 10px;
        }
    </style>

</head>

<body>

    <div class="card">
        <div class="card-image-title">
            <img src="./house1.jpg"
                 alt="haunted house">
        </div>

        <div class="card-description">
            <span>HAUNTED HOUSE: 200Y OLD</span> <br>
            <span>₨:1,20,99,999 ONLY</span> <br>
            <span>303 Bhooto ki Ghati</span> <br>
        </div>
        <hr>
        <div class="card-detail d-flex jc-between">
            <div class="d-flex al-center">
                <svg class="icon-box"
                     xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 24 24">
                    <path
                          d="M0 16L3 5V1a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v4l3 11v5a1 1 0 0 1-1 1v2h-1v-2H2v2H1v-2a1 1 0 0 1-1-1v-5zM19 5h1V1H4v4h1V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1h2V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1zm0 1v2a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V6h-2v2a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6H3.76L1.04 16h21.92L20.24 6H19zM1 17v4h22v-4H1zM6 4v4h4V4H6zm8 0v4h4V4h-4z">
                    </path>
                </svg> <span>3 Bedrooms</span>
            </div>

            <div class="d-flex al-center">
                <svg class="icon-box"
                     xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 24 24">
                    <path fill-rule="evenodd"
                          d="M17.03 21H7.97a4 4 0 0 1-1.3-.22l-1.22 2.44-.9-.44 1.22-2.44a4 4 0 0 1-1.38-1.55L.5 11h7.56a4 4 0 0 1 1.78.42l2.32 1.16a4 4 0 0 0 1.78.42h9.56l-2.9 5.79a4 4 0 0 1-1.37 1.55l1.22 2.44-.9.44-1.22-2.44a4 4 0 0 1-1.3.22zM21 11h2.5a.5.5 0 1 1 0 1h-9.06a4.5 4.5 0 0 1-2-.48l-2.32-1.15A3.5 3.5 0 0 0 8.56 10H.5a.5.5 0 0 1 0-1h8.06c.7 0 1.38.16 2 .48l2.32 1.15a3.5 3.5 0 0 0 1.56.37H20V2a1 1 0 0 0-1.74-.67c.64.97.53 2.29-.32 3.14l-.35.36-3.54-3.54.35-.35a2.5 2.5 0 0 1 3.15-.32A2 2 0 0 1 21 2v9zm-5.48-9.65l2 2a1.5 1.5 0 0 0-2-2zm-10.23 17A3 3 0 0 0 7.97 20h9.06a3 3 0 0 0 2.68-1.66L21.88 14h-7.94a5 5 0 0 1-2.23-.53L9.4 12.32A3 3 0 0 0 8.06 12H2.12l3.17 6.34z">
                    </path>
                </svg> <span>2 Bathrooms</span>
            </div>
        </div>
        <hr>

        <div class="card-footer">
            <span>RETAILER</span> <br>
            <div class="d-flex al-center"
                 style="gap:15px; margin-top: 6px;">
                <img class="img-profile"
                     src="./witcher.jpg"
                     alt="Witcher and ciri">
                <div>
                    <span>Witcher: Geralt of Rivia</span> <br>
                    <span>+91-9865745812</span>
                </div>
            </div>

        </div>
    </div>


</body>

</html>
