<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .border {
            border: 1px solid black;
        }


        .card {
            width: 300px;
            height: 300px;
            padding: 10px;
        }

        .d-flex {
            display: flex;
        }

        .jc-between {
            justify-content: space-between;
        }

        .title {
            text-align: center;
            margin: 25px 0px;
        }

        .title-heading {
            font-size: 2rem;
        }

        .title-subheading {}
    </style>

</head>


<!-- css:   inline (style attribute), internal (style element), external 
    
    #id selector, .class selector, tagName
-->

<body>
    <div class="border card">
        <div class="border d-flex jc-between"
             style="height: 10%;">

            <span>29 July 2024</span>
            <i class="bi bi-three-dots-vertical"></i>

        </div>

        <div class="border"
             style="height: 70%;">

            <div class="title">
                <span class="title-heading">Web Design</span> <br>
                <span>FlipKart</span>
            </div>

            <div class="progress"></div>

        </div>
        <div class="border"
             style="height: 20%;"></div>
    </div>


    <p>
        Lorem ipsum, dolor sit amet <span>consectetur adipisicing elit</span>. Quasi molestias totam
        omnis
        blanditiis repudiandae delectus vero accusamus distinctio, laborum dolorem.
    </p>

</body>

</html>
