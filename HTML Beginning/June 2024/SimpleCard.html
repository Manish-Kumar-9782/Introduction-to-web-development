<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .border {
            border: 1px solid black;
        }


        .card {
            width: 300px;
            /* height: 300px; */
            padding: 10px;
            border-radius: 8px;
        }

        .d-flex {
            display: flex;
        }

        .jc-between {
            justify-content: space-between;
        }

        .al-center {
            align-items: center;
        }

        .title {
            text-align: center;
            margin: 25px 0px;
        }

        .title-heading {
            font-size: 2rem;
        }

        .w-100 {
            width: 100%;
        }

        .user-icon {
            font-size: 28px;
        }

        .footer {
            margin: 10px 0px;
        }

        .title-subheading {}
    </style>

</head>


<!-- css:   inline (style attribute), internal (style element), external 
    
    #id selector, .class selector, tagName
-->

<body>
    <div class="border card">
        <div class="d-flex jc-between">

            <span>29 July 2024</span>
            <i class="bi bi-three-dots-vertical"></i>

        </div>

        <div class="">

            <div class="title">
                <span class="title-heading">Web Design</span> <br>
                <span>FlipKart</span>
            </div>

            <div class="progress">
                <span>Progress</span> <br>

                <!-- 
                value: how progress is done
                    max: maximum value of progress.
                    
                    default: max: 1.0
                    value: unknown
                 -->
                <progress class="w-100"
                          value="0.7"
                          max="1.0"></progress>
            </div>

        </div>
        <div class="d-flex jc-between al-center footer">

            <div>
                <i class="bi bi-person-circle user-icon"></i>
                <i class="bi bi-person-circle user-icon"></i>
                <i class="bi bi-person-circle user-icon"></i>
            </div>


            <span>3 Days Left</span>

        </div>
    </div>

</body>

</html>
