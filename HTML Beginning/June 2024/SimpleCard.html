<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .border {
            border: 1px solid black;
        }


        .card {
            width: 300px;
            /* height: 300px; */
            padding: 10px;
            /* border-radius: 8px; */
            background-color: #f0f0f3;
            box-shadow: 10px 10px 30px #aeaec0, -10px -10px 30px #fff;
            color: #9c9c9c;
        }

        .d-flex {
            display: flex;
        }

        .jc-between {
            justify-content: space-between;
        }

        .al-center {
            align-items: center;
        }

        .title {
            text-align: center;
            margin: 25px 0px;
        }

        .w-100 {
            width: 100%;
        }

        .user-icon {
            font-size: 28px;
        }

        .footer {
            margin: 10px 0px;
        }

        .title-heading {
            font-size: 2rem;
            color: #112d60ab;
        }

        .title-subheading {
            color: #647b87;
        }


        .info {
            background-color: #3b4558;
            padding: 6px;
            border-radius: 8px;
        }

        .text-color {
            color: #3b4558;
        }

        /* Applying some color styling and centering*/

        body {

            /* first applying flex and setting body child element to center of the body

            Note1: since height of body is not equal to viewport. so we need to set height as 100vh;

            Note2: since body contains some margin so our web page will have scroll bar un-necessary. for that we need to reset margin to 0px.
            */

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0px;
        }
    </style>

</head>


<!-- css:   inline (style attribute), internal (style element), external 
    
    #id selector, .class selector, tagName
-->

<body>
    <div class="card">
        <div class="d-flex jc-between">

            <span>29 July 2024</span>
            <i class="bi bi-three-dots-vertical"></i>

        </div>

        <div class="">

            <div class="title">
                <span class="title-heading">Web Design</span> <br>
                <span class="title-subheading">FlipKart</span>
            </div>

            <div class="progress">
                <span>Progress</span> <br>

                <!-- 
                value: how progress is done
                    max: maximum value of progress.
                    
                    default: max: 1.0
                    value: unknown
                 -->
                <progress class="w-100"
                          value="0.7"
                          max="1.0"></progress>
            </div>

        </div>
        <div class="d-flex jc-between al-center footer">

            <div class="text-color">
                <i class="bi bi-person-circle user-icon"></i>
                <i class="bi bi-person-circle user-icon"></i>
                <i class="bi bi-person-circle user-icon"></i>
            </div>


            <span class="info">3 Days Left</span>

        </div>
    </div>

</body>

</html>
