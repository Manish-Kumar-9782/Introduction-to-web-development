<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Simple Todo List</title>
</head>

<body>

    <button id="myButton">Add Item</button>
    <ul id="myList"></ul>

    <script>
        // Get references to the button and the unordered list
        const button = document.getElementById('myButton');
        const listContainer = document.getElementById('myList');

        // Add an event listener to the button
        button.addEventListener('click', () => {
            // Prompt the user for input
            const userInput = prompt('Enter a list item:');

            // Create a new list item element
            const newItem = document.createElement('li');

            // Set the text content of the new item to the user input
            newItem.innerText = userInput;

            // Append the new item to the list container
            listContainer.appendChild(newItem);
        });
    </script>
</body>

</html>
