<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <title>Js Forms</title>
</head>

<body class="d-flex flex-column min-vh-100 align-items-center justify-content-center">


    <div class="container p-5 w-50 shadow border boder-3 ">
        <form action="#"
              method="post"
              id="user-form">

            <div class="mb-4">
                <label for="first_name"
                       class="form-label">First Name</label>
                <input type="text"
                       class="form-control"
                       name="firstName"
                       id="first_name">
            </div>

            <div class="mb-4">
                <label for="second_name"
                       class="form-label">Second Name</label>
                <input type="text"
                       class="form-control"
                       name="secondName"
                       id="second_name">
            </div>


            <div class="mb-4">
                <label for="email"
                       class="form-label">Email</label>
                <input type="email"
                       class="form-control"
                       name="emailAddress"
                       id="email">
            </div>

            <div class="mb-4">
                <label for="phone"
                       class="form-label">Phone Number</label>
                <input type="tel"
                       class="form-control"
                       name="phoneNumber"
                       id="phone">
            </div>


            <input type="submit"
                   value="Save"
                   class="btn btn-success">
        </form>
    </div>



    <script id="Base Script">
        const form = document.forms["user-form"]
    </script>

    // Accessing Form data : Using Direct Property Assignment
    <script>
        const handleFormSave_v1 = (e) => {
            e.preventDefault();
            console.log("my event: ", e);

            const form_data = {
                first_name: form["first_name"].value,
                second_name: form["second_name"].value,
                email: form["email"].value,
                phone: form["phone"].value
            };

            console.log("form_data v1:", form_data);
        }
    </script>


    // Accessing Form data : Using Computed Property Names
    <script>
        const handleFormSave_v2 = (e) => {
            e.preventDefault();
            console.log("my event: ", e);

            const form_data = {
                [form["first_name"].name]: form["first_name"].value,
                [form["second_name"].name]: form["second_name"].value,
                [form["email"].name]: form["email"].value,
                [form["phone"].name]: form["phone"].value
            };

            console.log("form_data v2:", form_data);
        }
    </script>


    // Accessing Form data : Using a helper Function
    <script>

        // helper function
        // inputs: ["first_name", "second_name", "email", "phone"]
        function getFormData(formElement, inputs) {
            let formData = {}  // creating an empty object to store the form data

            // loop through each inputElement by id in the inputIds array
            for (let inputId in inputs) {
                let key = formElement[inputId].name
                let value = formElement[inputId].value

                formData[key] = value
            }

            return formData
        }

        const handleFormSave_v3 = (e) => {
            e.preventDefault();
            console.log("my event: ", e);

            const form_data = getFormData(form, ["first_name", "second_name", "email", "phone"]);

            console.log("form_data v3:", form_data);
        }
    </script>

</body>

</html>
