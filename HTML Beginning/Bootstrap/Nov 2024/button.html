<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Button Demo</title>
</head>

<body>

    <button id="btn1"
            onclick="handleClick()">Click Me</button>

    <h1 id="mytext"> </h1>


    <!-- 
    dynamicly creating a list item to my list
    -->

    <button id="list-button">Add Item</button>
    <ol id="mylist">

    </ol>

    <script>
        // Get the button element
        const btn1 = document.getElementById("btn1")
        const myText = document.getElementById("mytext")

        const handleClick = function () {
            alert('hello world.!!!')
            console.log('hello')
        }

        btn1.addEventListener("click", (e) => {
            console.log('button clicked from second click btn1 event function.')
            console.log(e)

            myText.innerText = "Helooooo, I Am Guddu.. Good Morning..🐻🐻🐻🐻🐻"
        })

        console.log("Script loaded")
    </script>


    <script>

        const mylist = document.getElementById("mylist")
        const listButton = document.getElementById("list-button")

        listButton.addEventListener("click", () => {

            // first create a new list item
            const li = document.createElement("li")
            li.innerText = prompt("Enter list content")
            mylist.appendChild(li)

        })


    </script>
</body>

</html>
